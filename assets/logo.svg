<svg viewBox="0 0 320 72" xmlns="http://www.w3.org/2000/svg" fill="none" aria-label="BlockEstate logo powered by NDC">
<!-- icono: cuadrado redondeado gris oscuro -->
<rect x="0" y="0" width="64" height="64" rx="14" fill="#10222B"/>
<!-- skyline verde -->
<g fill="#22C55E">
<!-- edificio izquierdo (corto) -->
<rect x="14" y="36" width="12" height="16" rx="1.5"/>
<!-- edificio derecho (mediano) -->
<rect x="40" y="28" width="12" height="24" rx="1.5"/>
<!-- edificio central (alto, con arco/anillo arriba) -->
<path d="M27 16 h12 v36 h-12 z" /><g stroke="#10222B" stroke-width="1.3"><path d="M28 24 h10 M28 31 h10 M28 38 h10 M28 45 h10 M33 17 v34"/></g>
<circle cx="33" cy="15" r="3.2" fill="none" stroke="#22C55E" stroke-width="2.5"/>
<!-- signo igual -->
<rect x="56" y="27" width="5" height="3" rx="1"/>
<rect x="56" y="34" width="5" height="3" rx="1"/>
</g>
<!-- wordmark -->
<g transform="translate(74,0)">
<text x="0" y="38" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5" fill="#10222B">BLOCK<tspan fill="#22C55E">ESTATE</tspan></text>
<text x="2" y="58" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="10" letter-spacing="2.2" fill="#16A34A">POWERED BY NDC</text>
</g>
</svg>
