<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockEstate | Launching soon</title>
<meta name="description" content="BlockEstate is about to launch the biggest real estate platform that buys with cryptocurrency only, in the world. Are you ready?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>

    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:#000;color:#fff;
      font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
      overflow:hidden;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    .stage{
      position:relative;isolation:isolate;
      height:100vh;height:100dvh;
      display:flex;flex-direction:column;
      padding:clamp(16px,3vh,40px) clamp(18px,4vw,72px) clamp(20px,3.4vh,46px);
      gap:clamp(12px,2vh,26px);
    }
    .stage::before{
      content:"";position:absolute;left:-10%;right:-10%;top:26%;height:52vh;z-index:-1;
      background:radial-gradient(58% 62% at 50% 58%,rgba(34,197,94,.10),rgba(34,197,94,0) 72%);
      pointer-events:none;
    }
    .brand{
      flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
      gap:9px;text-align:center;
    }
    .brand .name{
      font-size:clamp(19px,2.25vw,29px);font-weight:900;line-height:1;
      letter-spacing:.30em;text-indent:.30em;color:#fff;
    }
    .brand .by{
      font-size:clamp(8.5px,.72vw,10.5px);font-weight:600;line-height:1;
      letter-spacing:.36em;text-indent:.36em;text-transform:uppercase;
      color:rgba(255,255,255,.55);
    }
    .scene{
      flex:0 0 40vh;height:40vh;width:100%;
      display:flex;align-items:center;justify-content:center;
    }
    .scene svg{width:100%;height:100%;display:block;overflow:visible}
    .copy{
      flex:1 1 auto;min-height:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:clamp(20px,3.4vh,42px);text-align:center;
    }
    .head{
      margin:0;max-width:min(1180px,94vw);
      text-transform:uppercase;font-weight:900;
      font-size:clamp(19px,2.95vw,50px);
      line-height:1.04;letter-spacing:-.02em;
      color:#fff;text-wrap:balance;
    }
    .head .hl{color:#22C55E}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      padding:clamp(14px,1.8vh,20px) clamp(40px,4.4vw,60px);
      background:#22C55E;color:#000;text-decoration:none;
      font-size:clamp(12px,.98vw,15px);font-weight:800;
      letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;
      border-radius:14px;border:1px solid rgba(255,255,255,.12);
      transition:transform .28s cubic-bezier(.2,.7,.3,1),background-color .28s ease;
      will-change:transform;
    }
    .btn:hover{background:#16A34A;transform:translateY(-4px)}
    .btn:active{transform:translateY(-1px)}
    .btn:focus-visible{outline:2px solid rgba(34,197,94,.6);outline-offset:4px}
    @media (max-height:640px){
      .scene{flex-basis:34vh;height:34vh}
      .head{font-size:clamp(16px,3vw,28px)}
    }
    @media (max-width:600px){
      .brand .name{letter-spacing:.2em;text-indent:.2em}
      .head{font-size:clamp(16px,4.6vw,24px)}
    }
  </style>
</head>
