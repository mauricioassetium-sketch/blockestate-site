const b64d = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(clave) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64d(P.salt), iterations:310000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plano = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(P.iv), tagLength:128 }, key, P.ct ? concat() : null);
  return new TextDecoder().decode(plano);
  function concat() {
    const ct = b64d(P.ct), tag = b64d(P.tag), out = new Uint8Array(ct.length + tag.length);
    out.set(ct, 0); out.set(tag, ct.length); return out;
  }
}
async function intentar() {
  const msg = document.getElementById('msg');
  const v = document.getElementById('k').value;
  if (!v) { msg.textContent = 'Enter the key.'; return; }
  msg.style.color = '#93A1B0'; msg.textContent = 'Opening...';
  try {
    const texto = await abrir(v);
    const url = URL.createObjectURL(new Blob([texto], { type:'text/html' }));
    const f = document.getElementById('doc');
    f.src = url; f.style.display = 'block';
    document.getElementById('gate').style.display = 'none';
    document.body.style.background = '#fff';
    sessionStorage.setItem('be_docs', v);
  } catch (e) {
    msg.style.color = '#ff8a8a'; msg.textContent = 'Wrong key.';
    document.getElementById('k').select();
  }
}
document.getElementById('go').addEventListener('click', intentar);
document.getElementById('k').addEventListener('keydown', e => { if (e.key === 'Enter') intentar(); });
