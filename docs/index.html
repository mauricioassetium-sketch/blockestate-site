async function abrir(clave) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64d(P.salt), iterations:310000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plano = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(P.iv), tagLength:128 }, key, P.ct ? concat() : null);
  return new TextDecoder().decode(plano);
  function concat() {
    const ct = b64d(P.ct), tag = b64d(P.tag), out = new Uint8Array(ct.length + tag.length);

    const texto = await abrir(v);

    const f = document.getElementById('doc');
