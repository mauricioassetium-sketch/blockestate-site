<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NDC · Gancho 3s</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}

  /* fondo negro puro */
  #bg{position:fixed;inset:0;background:#000}

  /* el gancho: tu imagen exacta, sin tocar el diseño */
  #hook{position:relative;width:min(52vh,70vw);transform:translateY(0)}

  /* fase 1: bajar y subir (0s → 2.2s); fase 2: desaparecer (2.3s → 3s) */
  @keyframes bob{
    0%   {transform:translateY(-28vh)}
    50%  {transform:translateY(10vh)}
    100% {transform:translateY(-28vh)}
  }
  #hook.anim{animation:bob 2.2s cubic-bezier(.45,.05,.55,.95) forwards}

  @keyframes fade{
    from{opacity:1}
    to  {opacity:0}
  }
  /* todo el escenario se desvanece al final y queda negro */
  #stage.fade{animation:fade .7s ease-in forwards}

  #replay{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:transparent;border:1px solid #2a2a2a;color:#7a7a7a;
    font:700 11px/1 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;
    padding:11px 24px;border-radius:99px;cursor:pointer;transition:.25s;z-index:10}
  #replay:hover{border-color:#22C55E;color:#22C55E}
</style></head>
<body>
  <div id="bg"></div>
  <div id="stage">
    <img id="hook" src="hook.png" alt="NDC hook">
  </div>
  <button id="replay">↻ Reproducir</button>

<script>
  const hook = document.getElementById('hook');
  const stage = document.getElementById('stage');
  const bg = document.getElementById('bg');

  function play(){
    // reset
    stage.classList.remove('fade');
    stage.style.opacity = '1';
    hook.classList.remove('anim');
    void hook.offsetWidth;            // fuerza reflow para reiniciar animación
    hook.classList.add('anim');       // baja y sube (2.2s)

    // al terminar el bajar/subir, desaparecer todo a negro (últimos 0.7s → 3s total)
    setTimeout(function(){
      stage.classList.add('fade');
    }, 2200);
  }

  document.getElementById('replay').addEventListener('click', play);
  // reproducir automáticamente al cargar
  play();
</script>
</body></html>
